name: Build and Push Docker Image

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Login to DHI registry (dhi.io)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - name: Build image for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          push: false
          load: true
          tags: marp-test:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test – Marp CLI PDF build via Chromium
        run: |
          mkdir -p /tmp/marp-test
          chmod 777 /tmp/marp-test
          cat > /tmp/marp-test/test.md << 'MDEOF'
          ---
          marp: true
          ---
          # Test slide
          Hello World
          MDEOF
          docker run --rm \
            -v /tmp/marp-test:/work \
            -w /work \
            marp-test:ci \
            sh -c "npx --yes @marp-team/marp-cli@latest --pdf --allow-local-files test.md -o test.pdf"
          test -f /tmp/marp-test/test.pdf && echo "PDF generated OK"

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Extract Alpine tag from Dockerfile
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          FROM_LINE="$(grep -m1 -E '^FROM ' Dockerfile)"
          BASE_TAG="$(echo "$FROM_LINE" | sed -E 's/^FROM[[:space:]]+[^:]+:([^[:space:]]+).*/\1/')"
          ALPINE_VER="$(echo "$BASE_TAG" | sed -nE 's/^([0-9]+\.[0-9]+).*/\1/p')"
          echo "base_tag=$BASE_TAG" >> "$GITHUB_OUTPUT"
          echo "alpine_ver=$ALPINE_VER" >> "$GITHUB_OUTPUT"
          echo "Detected: base_tag=$BASE_TAG alpine_ver=$ALPINE_VER"

      # 1) Login DHI
      - name: Login to DHI registry (dhi.io)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 2) Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/marp-presentation-builder:latest
            ${{ secrets.DOCKER_USERNAME }}/marp-presentation-builder:alpine${{ steps.ver.outputs.alpine_ver }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/marp-presentation-builder:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Run Trivy vulnerability scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/marp-presentation-builder:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4
        with:
          sarif_file: trivy-results.sarif
